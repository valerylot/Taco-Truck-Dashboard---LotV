<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isaiah's Taco Truck</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>

<body class="mx-auto w-full min-h-screen max-w-[375px] bg-[#FAF5EB] text-[#20483F]">
    <!-- ===== THE HEADER ===== -->
    <header class="relative h-48 overflow-hidden rounded-b-[30px] bg-[#20483F] p-6 text-[#FAF5EB]">
        <img src="assets/tacos.jpg" alt="photo of tacos" class="absolute inset-0 h-full w-full object-cover opacity-20">
        <h1 class="text-center text-4xl font-bold font-[family-name:'Bebas_Neue'] tracking-[0.2em]">Isaiah's</h1>
        <h2 class="mt-1 text-center text-xl font-extrabold font-[family-name:'Bebas_Neue'] tracking-[0.3em]">Taco Truck
        </h2>
        <p class="text-center text-sm mt-3 font-[family-name:'Bebas_Neue'] tracking-[0.3em]">Your Tacos, Your Way</p>
    </header>

    <main>
        <!-- ===== CLOSE STATUS & LOCATION DISPLAY ===== -->
        <section class="m-4 rounded-2xl border border-[#E3DCCE] p-4 shadow-sm">
            <div class="flex gap-3 items-center justify-around">
                <h3 id="status" class="mt-4 text-3xl mb-5 font-semibold closed">Closed</h3>
                <button id="open-button" class="border-1 border-black px-2 py-1 rounded-md bg-[#20483F] text-white text-xs open">Open the truck</button>
            </div>
        </section>

        <p id="location-display" class="mt-1 text-lg font-semibold pl-5 bg-[#E1E7D7] py-2">📍Today we are located at:
        </p>

        <!-- ===== THE LOCATION ===== -->
        <div class="my-4 pl-5">
            <label for="new-location" class="block mb-2">Where we are today:</label>
            <input id="new-location" type="text" class="border p-2 mb-2 rounded-md mr-1" placeholder="Today's location">
            <button id="location-button"
                class="border-1 border-black px-2 py-1 rounded-md bg-[#C85D38] text-white text-xs">Set Location</button>
        </div>

        <!-- ===== THE MENU INPUT ===== -->
        <div class="pl-5 my-4 border-dotted border-t-1 pt-2">
            <form id="menu-form">
                <label for=" new-item" class="block mb-2">Add Item To The Menu:</label>
                <input id="new-item" type="text" class="border p-2 mb-2 rounded-md" placeholder="Menu item">
                <input id="new-item-description" type="text" class="border p-2 mb-2 rounded-md"
                    placeholder="Description"><br>
                <button id="new-item-button" type="submit"
                    class="border-1 border-black px-2 py-1 rounded-md bg-[#C85D38] text-white text-xs">Add Menu Item</button>
            </form>
        </div>

        <p class="font-bold text-center text-xl">Menu Items Available</p>
        <section class="mx-4 mb-4 rounded-2xl border border-[#E3DCC3] bg-white p-4 shadow-sm">
            <!-- ===== THE MENU LIST ===== -->
            <ul id="menu-list" class="list-disc pl-5"></ul>

            <!-- ===== SOLD COUNTER =====  -->
            <p id="items-sold" class="rounded-md bg-[#20483F] px-3 py-2 text-sm font-semibold text-white mt-2">Total Items Sold: </p>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
